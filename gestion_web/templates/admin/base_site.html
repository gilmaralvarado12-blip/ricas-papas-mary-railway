{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var navigation = document.getElementById('jazzy-navigation');
        if (!navigation || document.getElementById('desktop-logout-form')) {
            return;
        }

        var item = document.createElement('li');
        item.className = 'nav-item';
        item.innerHTML = '<form id="desktop-logout-form" method="post" action="{% url "admin:logout" %}">' +
            '{% csrf_token %}' +
            '<button type="submit" class="nav-link desktop-logout-link">' +
            '<i class="nav-icon fas fa-sign-out-alt"></i><p>Cerrar sesión</p></button></form>';
        navigation.appendChild(item);
    });
</script>
{% endblock %}
