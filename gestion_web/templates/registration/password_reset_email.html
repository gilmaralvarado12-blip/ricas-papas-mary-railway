{% autoescape off %}
<p>Hola {{ user.get_username }},</p>
<p>Recibimos una solicitud para cambiar la contraseña de tu cuenta. Haz clic en el siguiente enlace para restablecerla:
</p>
<p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">Restablecer

<p>Si no solicitaste este cambio, ignora este mensaje.</p>
<p>Equipo Ricas Papas Mary</p>
{% endautoescape %}
