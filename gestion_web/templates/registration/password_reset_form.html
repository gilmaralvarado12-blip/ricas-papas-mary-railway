{% extends 'gestion_web/home.html' %}
{% block content %}
<div style="max-width:600px;margin:40px auto;background:#fff;padding:24px;border-radius:12px;">
  <h2 style="color:#b21e29">Restablecer contraseña</h2>
  <p>Introduce tu correo electrónico y te enviaremos un enlace para restablecer la contraseña.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}<br>
    {{ form.email }}
    <div style="margin-top:12px">
      <button type="submit"
        style="background:#b21e29;color:#fff;border:none;padding:10px 14px;border-radius:6px;">Solicitar enlace</button>
    </div>
  </form>
</div>
{% endblock %}
