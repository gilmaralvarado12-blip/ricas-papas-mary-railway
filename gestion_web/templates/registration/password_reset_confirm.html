{% extends 'gestion_web/home.html' %}
{% block content %}
<div style="max-width:600px;margin:40px auto;background:#fff;padding:24px;border-radius:12px;">
  <h2 style="color:#b21e29">Establecer nueva contraseña</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.new_password1.label_tag }}<br>
    {{ form.new_password1 }}<br><br>
    {{ form.new_password2.label_tag }}<br>
    {{ form.new_password2 }}
    <div style="margin-top:12px">
      <button type="submit"
        style="background:#b21e29;color:#fff;border:none;padding:10px 14px;border-radius:6px;">Cambiar
        contraseña</button>
    </div>
  </form>
</div>
{% endblock %}
