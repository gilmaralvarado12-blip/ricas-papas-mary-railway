{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricas Papas Mary</title>
    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">
    <style>
        :root {
            color-scheme: dark;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            background: radial-gradient(circle at top left, #ffcc4d 0%, rgba(255, 203, 64, 0.95) 18%, transparent 38%),
                        radial-gradient(circle at bottom right, #d31b1f 0%, rgba(183, 31, 41, 0.92) 30%, #7f1016 80%),
                        linear-gradient(180deg, #ffdd84 0%, #f43f5e 45%, #7f1016 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
            padding: 24px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(255,255,255,0.18), transparent 32%);
            pointer-events: none;
        }

        .splash-card {
            position: relative;
            z-index: 1;
            width: min(520px, 100%);
            padding: 36px 30px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(14px);
            animation: floatIn 1.25s ease-out backwards;
        }

        .logo-shell {
            width: clamp(130px, 22vw, 180px);
            height: clamp(130px, 22vw, 180px);
            margin: 0 auto 22px;
            padding: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 215, 79, 0.30) 54%, rgba(255, 255, 255, 0.05) 100%);
            border: 2px solid rgba(255, 255, 255, 0.28);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 16px 40px rgba(0, 0, 0, 0.20);
            display: grid;
            place-items: center;
        }

        .logo-shell img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand-title {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            margin: 0;
            line-height: 1.05;
            text-transform: uppercase;
            text-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
        }

        .brand-subtitle {
            margin-top: 12px;
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            color: rgba(255, 250, 235, 0.92);
        }

        .progress-ring {
            width: 100%;
            margin-top: 26px;
            display: flex;
            justify-content: center;
        }

        .progress-cycle {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.24);
            border-top-color: #ffeb99;
            animation: spinRing 3s linear infinite;
            box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.08);
        }

        .hint {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.98rem;
            line-height: 1.6;
        }

        @media (max-width: 500px) {
            .splash-card {
                padding: 28px 20px;
            }

            .brand-title {
                font-size: 2.1rem;
            }

            .hint {
                font-size: 0.96rem;
            }
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
    <meta http-equiv="refresh" content="3;url={% url 'home' %}">
</head>
<body>
    <!-- Pantalla de introducción con logo centrado y redirección automática al inicio -->
    <section class="splash-card" aria-label="Intro Ricas Papas Mary">
        <div class="logo-shell">
            <img src="{% static 'images/logo.png' %}" alt="Logo de Ricas Papas Mary">
        </div>
        <h1 class="brand-title">Ricas Papas Mary</h1>
        <p class="brand-subtitle">¡Bienvenido! Disfruta nuestro menú y realiza tu pedido</p>
        <div class="progress-ring" aria-hidden="true">
            <div class="progress-cycle"></div>
        </div>
        <p class="hint">Preparando una experiencia deliciosa para ti...</p>
    </section>
    <script>
        setTimeout(function() {
            window.location.href = "{% url 'home' %}";
        }, 3000);
    </script>
</body>
</html>
